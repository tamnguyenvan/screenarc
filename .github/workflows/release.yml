name: Release and Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege for the whole workflow. The `release` job runs semantic-release,
# which pushes the version-bump commit, tags it and creates the GitHub release, so
# the token needs write access to contents. The @semantic-release/github plugin
# also comments on the released pull requests and issues, which is what the
# pull-requests and issues scopes are for. Nothing else is granted: the build job
# only needs contents, and it narrows itself further with its own job-level block.
permissions:
  contents: write
  issues: write
  pull-requests: write

# A release must never be cancelled half-way through pushing a tag and creating a
# release, so — unlike the CI/checks workflows — cancel-in-progress is false. A
# single group means two releases queue and run one after the other rather than
# one clobbering the other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --- JOB 1: Create Release using Semantic Release (runs on every push to main) ---
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2: Build and Upload Artifacts ---
  build:
    name: Build & Upload Artifacts
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux dependencies (Xvfb + cursor helper build deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common xvfb rpm elfutils libclang-dev
          # The pinned pipewire/libspa crates (0.8.x) need spa headers >= 1.0 —
          # spa_video_info_raw gets its `flags` field there. Jammy's 0.3.48
          # predates it, so fetch newer headers from the official PipeWire PPA.
          # The helper links the ABI-stable libpipewire-0.3.so.0, so a binary
          # built against 1.x headers runs on 0.3.x machines too.
          sudo add-apt-repository -y ppa:pipewire-devel/pipewire
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev

      - name: Install Rust (cursor helper)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Download and setup FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p binaries/linux
          curl -L https://github.com/tamnguyenvan/screenarc-assets/releases/download/v0.0.1/ffmpeg -o binaries/linux/ffmpeg
          chmod +x binaries/linux/ffmpeg
        shell: bash

      - name: Download and setup FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p binaries/windows
          curl -L https://github.com/tamnguyenvan/screenarc-assets/releases/download/v0.0.1/ffmpeg.exe -o binaries/windows/ffmpeg.exe
        shell: bash

      - name: Install node-gyp globally (Windows)
        if: runner.os == 'Windows'
        run: npm install -g node-gyp

      - name: Download and setup FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p binaries/darwin
          curl -L https://github.com/tamnguyenvan/screenarc-assets/releases/download/v0.0.1/ffmpeg-darwin-arm64 -o binaries/darwin/ffmpeg-arm64
          curl -L https://github.com/tamnguyenvan/screenarc-assets/releases/download/v0.0.1/ffmpeg-darwin-x64 -o binaries/darwin/ffmpeg-x64
          chmod +x binaries/darwin/ffmpeg-*
        shell: bash

      - name: Install all dependencies
        run: npm ci

      - name: Set package.json version
        run: npm version ${{ needs.release.outputs.new_release_version }} --no-git-tag-version

      - name: Build Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required: bakes the production API base URL from a repository secret.
          # The build refuses to proceed if it is unset (see vite.config.ts).
          DEMOTHAT_DEFAULT_API_BASE_URL: ${{ secrets.DEMOTHAT_PRODUCTION_API_BASE_URL }}
          # The Wayland cursor helper is Linux-only, and a release without it ships
          # silent dead clicks (browser capture, pointer baked in). Make its absence
          # a hard failure instead of the warning-only default.
          DEMOTHAT_REQUIRE_CURSOR_HELPER: '1'
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            npm run dist:linux
          elif [ "${{ runner.os }}" == "Windows" ]; then
            npm run dist:win
          elif [ "${{ runner.os }}" == "macOS" ]; then
            npm run dist:mac
          fi
        shell: bash

      - name: Verify built files
        run: ls -R
        shell: bash

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release.outputs.new_release_tag }}
          overwrite: true
          file_glob: true
          file: dist/*.{AppImage,deb,rpm,zip,dmg,exe}
          make_latest: true
